<!doctype html>
<html>
  <body>
    <div class="page page-sysinfo">
      <style>
        .page-sysinfo {
          z-index: 4;
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: center;
          background: #000000;
          padding: clamp(32px, 6vh, 80px) clamp(32px, 6vw, 120px);
          box-sizing: border-box;
        }

        .sysinfo-container {
          width: 100%;
          max-width: clamp(920px, 80vw, 1520px);
          display: flex;
          flex-direction: column;
          gap: clamp(36px, 6vh, 80px);
        }

        /* Compute Grid (CPU, MEM, GPU) */
        .sysinfo-compute-grid {
          display: grid;
          grid-template-columns: repeat(3, 1fr);
          gap: clamp(24px, 3.6vw, 64px);
          align-items: center;
        }

        .sysinfo-card {
          display: flex;
          flex-direction: row;
          align-items: center;
          gap: clamp(16px, 2.2vw, 32px);
          min-width: 0;
          transition: opacity 300ms ease;
        }

        .sysinfo-metric[data-empty="true"] {
          opacity: 0.35;
        }

        /* Gauge with centered icon */
        .gauge-container {
          position: relative;
          width: clamp(56px, 9vh, 92px);
          height: clamp(56px, 9vh, 92px);
          min-width: clamp(56px, 9vh, 92px);
          display: flex;
          align-items: center;
          justify-content: center;
          flex-shrink: 0;
        }

        .gauge-svg {
          width: 100%;
          height: 100%;
          display: block;
        }

        .gauge-track {
          fill: none;
          stroke: rgba(255, 255, 255, 0.12);
          stroke-width: 10;
        }

        .gauge-fill {
          fill: none;
          stroke: #ffffff;
          stroke-width: 10;
          stroke-linecap: round;
          transform: rotate(-90deg);
          transform-origin: center;
          transition: stroke-dashoffset 450ms cubic-bezier(0.16, 1, 0.3, 1), stroke 300ms ease;
        }

        .sysinfo-metric.high-load .gauge-fill {
          stroke: #ef4444;
        }

        .gauge-icon-wrapper {
          position: absolute;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          pointer-events: none;
        }

        .gauge-icon-wrapper .sysinfo-icon {
          width: 44%;
          height: 44%;
          color: rgba(255, 255, 255, 0.7);
          transition: color 300ms ease;
        }

        .sysinfo-metric.high-load .gauge-icon-wrapper .sysinfo-icon {
          color: #ef4444;
        }


        /* I/O Grid (Network & Disk) */
        .sysinfo-io-grid {
          display: grid;
          grid-template-columns: repeat(2, 1fr);
          row-gap: clamp(24px, 4.2vh, 48px);
          column-gap: clamp(36px, 5.5vw, 88px);
          align-items: center;
        }

        .io-icon-badge {
          width: clamp(48px, 7.5vh, 72px);
          height: clamp(48px, 7.5vh, 72px);
          min-width: clamp(48px, 7.5vh, 72px);
          border-radius: clamp(14px, 2vh, 20px);
          background: rgba(255, 255, 255, 0.05);
          border: 1px solid rgba(255, 255, 255, 0.08);
          display: flex;
          align-items: center;
          justify-content: center;
          flex-shrink: 0;
          box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
        }

        .io-icon-badge .sysinfo-icon {
          width: clamp(24px, 3.8vh, 36px);
          height: clamp(24px, 3.8vh, 36px);
          color: rgba(255, 255, 255, 0.7);
        }

        .sysinfo-icon {
          display: block;
        }

        /* Value & Unit Typography */
        .metric-value-container {
          display: flex;
          align-items: baseline;
          min-width: 0;
        }

        .metric-value {
          font-family: "CastBoard Google Sans Flex", sans-serif;
          font-size: clamp(48px, 9.6vh, 108px);
          font-weight: 800;
          color: #ffffff;
          line-height: 0.95;
          letter-spacing: -0.04em;
          white-space: nowrap;
        }

        .sysinfo-io-card .metric-value {
          font-size: clamp(38px, 7.2vh, 80px);
        }

        .metric-unit {
          margin-left: clamp(6px, 0.8vw, 12px);
          font-size: clamp(16px, 3vh, 34px);
          font-weight: 700;
          color: rgba(248, 250, 252, 0.45);
          line-height: 1;
          white-space: nowrap;
          letter-spacing: -0.01em;
        }

        .sysinfo-io-card .metric-unit {
          font-size: clamp(15px, 2.6vh, 28px);
        }

        /* Portrait & Narrow screens */
        @media (max-aspect-ratio: 1/1) {
          .page-sysinfo {
            padding: clamp(24px, 4.5vh, 48px) clamp(20px, 4vw, 36px);
          }

          .sysinfo-container {
            gap: 32px;
            max-width: 440px;
          }

          .sysinfo-compute-grid {
            grid-template-columns: 1fr;
            gap: 18px;
          }

          .sysinfo-io-grid {
            grid-template-columns: 1fr;
            gap: 16px;
          }

          .metric-value {
            font-size: clamp(36px, 6vh, 48px);
          }

          .sysinfo-io-card .metric-value {
            font-size: clamp(28px, 4.8vh, 38px);
          }

          .gauge-container {
            width: 52px;
            height: 52px;
            min-width: 52px;
          }

          .io-icon-badge {
            width: 44px;
            height: 44px;
            min-width: 44px;
          }

          .io-icon-badge .sysinfo-icon {
            width: 22px;
            height: 22px;
          }

          .metric-unit,
          .sysinfo-io-card .metric-unit {
            font-size: 16px;
          }
        }
      </style>

      <div class="sysinfo-container">
        <!-- Top Tier: Compute Utilization (CPU, MEM, GPU) -->
        <section class="sysinfo-compute-grid">
          <!-- CPU -->
          <div class="sysinfo-card sysinfo-metric" data-key="cpu" role="img">
            <div class="gauge-container">
              <svg class="gauge-svg" viewBox="0 0 120 120">
                <circle class="gauge-track" cx="60" cy="60" r="50" />
                <circle class="gauge-fill" cx="60" cy="60" r="50" stroke-dasharray="314.159" stroke-dashoffset="314.159" data-fill />
              </svg>
              <div class="gauge-icon-wrapper">
                <svg class="sysinfo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="4" y="4" width="16" height="16" rx="2.5" />
                  <rect x="9" y="9" width="6" height="6" />
                  <path d="M9 1v3M15 1v3M9 20v3M15 20v3M20 9h3M20 15h3M1 9h3M1 15h3" />
                </svg>
              </div>
            </div>
            <div class="metric-value-container">
              <span class="metric-value" data-value>--</span><span class="metric-unit">%</span>
            </div>
          </div>

          <!-- Memory -->
          <div class="sysinfo-card sysinfo-metric" data-key="mem" role="img">
            <div class="gauge-container">
              <svg class="gauge-svg" viewBox="0 0 120 120">
                <circle class="gauge-track" cx="60" cy="60" r="50" />
                <circle class="gauge-fill" cx="60" cy="60" r="50" stroke-dasharray="314.159" stroke-dashoffset="314.159" data-fill />
              </svg>
              <div class="gauge-icon-wrapper">
                <svg class="sysinfo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M2 7a1.5 1.5 0 0 1 1.5-1.5h17A1.5 1.5 0 0 1 22 7v8.5a1.5 1.5 0 0 1-1.5 1.5h-17A1.5 1.5 0 0 1 2 15.5Z" />
                  <path d="M6 17v2M10 17v2M14 17v2M18 17v2" />
                  <rect x="5.5" y="8.5" width="2.5" height="5" rx="0.5" fill="currentColor" stroke="none" />
                  <rect x="10.75" y="8.5" width="2.5" height="5" rx="0.5" fill="currentColor" stroke="none" />
                  <rect x="16" y="8.5" width="2.5" height="5" rx="0.5" fill="currentColor" stroke="none" />
                </svg>
              </div>
            </div>
            <div class="metric-value-container">
              <span class="metric-value" data-value>--</span><span class="metric-unit">%</span>
            </div>
          </div>

          <!-- GPU -->
          <div class="sysinfo-card sysinfo-metric" data-key="gpu" role="img">
            <div class="gauge-container">
              <svg class="gauge-svg" viewBox="0 0 120 120">
                <circle class="gauge-track" cx="60" cy="60" r="50" />
                <circle class="gauge-fill" cx="60" cy="60" r="50" stroke-dasharray="314.159" stroke-dashoffset="314.159" data-fill />
              </svg>
              <div class="gauge-icon-wrapper">
                <svg class="sysinfo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M2 4v16" />
                  <rect x="4" y="6" width="18" height="12" rx="2" />
                  <circle cx="10" cy="12" r="3" />
                  <circle cx="16.5" cy="12" r="3" />
                  <path d="M7 18v2.5M11 18v2.5" />
                </svg>
              </div>
            </div>
            <div class="metric-value-container">
              <span class="metric-value" data-value>--</span><span class="metric-unit">%</span>
            </div>
          </div>
        </section>

        <!-- Bottom Tier: I/O Throughput (Network & Disk) -->
        <section class="sysinfo-io-grid">
          <!-- Network Download -->
          <div class="sysinfo-card sysinfo-io-card sysinfo-metric" data-key="netDown" role="img">
            <div class="io-icon-badge">
              <svg class="sysinfo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                <polyline points="7 10 12 15 17 10" />
                <line x1="12" y1="15" x2="12" y2="3" />
              </svg>
            </div>
            <div class="metric-value-container">
              <span class="metric-value" data-value-for="netDown">--</span><span class="metric-unit" data-unit-for="netDown"></span>
            </div>
          </div>

          <!-- Network Upload -->
          <div class="sysinfo-card sysinfo-io-card sysinfo-metric" data-key="netUp" role="img">
            <div class="io-icon-badge">
              <svg class="sysinfo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                <polyline points="17 8 12 3 7 8" />
                <line x1="12" y1="3" x2="12" y2="15" />
              </svg>
            </div>
            <div class="metric-value-container">
              <span class="metric-value" data-value-for="netUp">--</span><span class="metric-unit" data-unit-for="netUp"></span>
            </div>
          </div>

          <!-- Disk Read -->
          <div class="sysinfo-card sysinfo-io-card sysinfo-metric" data-key="diskRead" role="img">
            <div class="io-icon-badge">
              <svg class="sysinfo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="14" width="20" height="8" rx="2" />
                <path d="M6 18h.01M10 18h.01" />
                <polyline points="7 9 12 14 17 9" />
                <line x1="12" y1="14" x2="12" y2="2" />
              </svg>
            </div>
            <div class="metric-value-container">
              <span class="metric-value" data-value-for="diskRead">--</span><span class="metric-unit" data-unit-for="diskRead"></span>
            </div>
          </div>

          <!-- Disk Write -->
          <div class="sysinfo-card sysinfo-io-card sysinfo-metric" data-key="diskWrite" role="img">
            <div class="io-icon-badge">
              <svg class="sysinfo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="14" width="20" height="8" rx="2" />
                <path d="M6 18h.01M10 18h.01" />
                <polyline points="17 7 12 2 7 7" />
                <line x1="12" y1="2" x2="12" y2="14" />
              </svg>
            </div>
            <div class="metric-value-container">
              <span class="metric-value" data-value-for="diskWrite">--</span><span class="metric-unit" data-unit-for="diskWrite"></span>
            </div>
          </div>
        </section>
      </div>
    </div>

    <script>
      (function() {
        let mountedContainer = null;

        const currentValues = {
          cpu: null,
          mem: null,
          gpu: null,
          netDown: null,
          netUp: null,
          diskRead: null,
          diskWrite: null,
        };
        const activeAnimations = {};

        function easeOutCubic(t) {
          return 1 - Math.pow(1 - t, 3);
        }

        function cancelAnimation(key) {
          if (activeAnimations[key]) {
            cancelAnimationFrame(activeAnimations[key].rafId);
            delete activeAnimations[key];
          }
        }

        function cancelAllAnimations() {
          for (const key of Object.keys(activeAnimations)) {
            cancelAnimationFrame(activeAnimations[key].rafId);
            delete activeAnimations[key];
          }
        }

        function animateValue(key, targetValue, onUpdate, duration = 350) {
          if (targetValue === null || targetValue === undefined) {
            cancelAnimation(key);
            currentValues[key] = null;
            onUpdate(null);
            return;
          }

          const targetNum = Number(targetValue);
          const startVal = currentValues[key] === null ? targetNum : currentValues[key];

          if (currentValues[key] === null || startVal === targetNum) {
            cancelAnimation(key);
            currentValues[key] = targetNum;
            onUpdate(targetNum);
            return;
          }

          cancelAnimation(key);

          const startTime = performance.now();

          function step(now) {
            const elapsed = now - startTime;
            const progress = Math.min(1, elapsed / duration);
            const eased = easeOutCubic(progress);
            const current = startVal + (targetNum - startVal) * eased;
            currentValues[key] = current;
            onUpdate(current);

            if (progress < 1) {
              activeAnimations[key] = {
                rafId: requestAnimationFrame(step),
              };
            } else {
              currentValues[key] = targetNum;
              onUpdate(targetNum);
              delete activeAnimations[key];
            }
          }

          activeAnimations[key] = {
            rafId: requestAnimationFrame(step),
          };
        }

        function normalize(value) {
          if (value === null || value === undefined) return null;
          const parsed = Number(value);
          if (!Number.isFinite(parsed)) return null;
          return Math.min(100, Math.max(0, parsed));
        }

        function localizeUI(container) {
          const t = parent.castBoardI18n.messages("sysinfo");
          if (!t) return;
          const map = {
            cpu: t.cpuDesc,
            mem: t.memDesc,
            gpu: t.gpuDesc,
            netDown: t.netDownDesc,
            netUp: t.netUpDesc,
            diskRead: t.diskReadDesc,
            diskWrite: t.diskWriteDesc,
          };
          for (const [key, desc] of Object.entries(map)) {
            const el = container.querySelector(`[data-key="${key}"]`);
            if (el && desc) {
              el.setAttribute("title", desc);
              el.setAttribute("aria-label", desc);
            }
          }
        }

        // Format speed rate in B/s, KB/s, MB/s, GB/s
        function formatRate(value) {
          if (value === null || value === undefined) return { value: "--", unit: "" };
          const bytes = Math.max(0, Number(value));
          if (!Number.isFinite(bytes)) return { value: "--", unit: "" };
          const units = ["B/s", "KB/s", "MB/s", "GB/s"];
          let scaled = bytes;
          let index = 0;
          while (scaled >= 1024 && index < units.length - 1) {
            scaled /= 1024;
            index += 1;
          }
          const text = scaled >= 100 || index === 0 ? String(Math.round(scaled)) : scaled.toFixed(1);
          return { value: text, unit: units[index] };
        }

        function render(container) {
          const latestStats = parent.window.latestSysInfoStats;
          if (!container || !latestStats) return;

          for (const key of ["cpu", "mem", "gpu"]) {
            const metric = container.querySelector(`[data-key="${key}"]`);
            const fillEl = metric?.querySelector("[data-fill]");
            if (!metric || !fillEl) continue;

            const value = normalize(latestStats[key]);
            metric.dataset.empty = value == null ? "true" : "false";

            // Circumference of r=50 circle is 2 * PI * 50 = 314.159
            const dashoffset = value == null ? 314.159 : 314.159 * (1 - value / 100);
            fillEl.setAttribute("stroke-dashoffset", String(dashoffset));

            if (value !== null && value > 75) {
              metric.classList.add("high-load");
            } else {
              metric.classList.remove("high-load");
            }

            animateValue(key, value, (current) => {
              if (!mountedContainer) return;
              const curValueEl = metric.querySelector("[data-value]");
              if (curValueEl) {
                curValueEl.textContent = current == null ? "--" : String(Math.round(current));
              }
            });
          }

          for (const key of ["netDown", "netUp", "diskRead", "diskWrite"]) {
            const metric = container.querySelector(`[data-key="${key}"]`);
            if (!metric) continue;

            const raw = latestStats[key];
            const empty = raw == null;
            metric.dataset.empty = empty ? "true" : "false";

            animateValue(key, raw, (current) => {
              if (!mountedContainer) return;
              const curValueEl = metric.querySelector(`[data-value-for="${key}"]`);
              const curUnitEl = metric.querySelector(`[data-unit-for="${key}"]`);
              if (curValueEl && curUnitEl) {
                const formatted = formatRate(current);
                curValueEl.textContent = formatted.value;
                curUnitEl.textContent = formatted.unit;
              }
            });
          }
        }

        parent.window.addEventListener("sysinfo-stats-change", () => render(mountedContainer));

        parent.pages.sysinfo = {
          template: document.body.innerHTML,
          mount(container) {
            mountedContainer = container;
            localizeUI(container);
            render(container);
            parent.window.castBoardHost.startSysInfoAlive();
          },
          unmount() {
            mountedContainer = null;
            parent.window.castBoardHost.stopSysInfoAlive();
            cancelAllAnimations();
            for (const key of Object.keys(currentValues)) {
              currentValues[key] = null;
            }
          },
          cleanup() {
            mountedContainer = null;
            parent.window.castBoardHost.stopSysInfoAlive();
            cancelAllAnimations();
            for (const key of Object.keys(currentValues)) {
              currentValues[key] = null;
            }
          }
        };
      })();
    </script>
  </body>
</html>
